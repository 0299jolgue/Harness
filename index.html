\n</style></head><body><div class="shell"><aside class="sidebar" id="sidebar"><div class="sidehead"><div class="brand"><span class="brand-mark">✳</span>ChatGPT</div><button class="icon" id="collapse" title="Fechar barra lateral">◧</button></div><button class="sidebtn" id="newchat"><span class="glyph">✎</span><span>Nova conversa</span><span style="margin-left:auto;color:#888">⌘ K</span></button><button class="sidebtn" id="searchchat"><span class="glyph">⌕</span><span>Pesquisar conversas</span></button><button class="sidebtn" id="openmodels"><span class="glyph">◉</span><span>Modelos e endpoints</span></button><button class="sidebtn" id="openworkspace"><span class="glyph">▣</span><span>Pasta projetos</span></button><div class="section-label">Recentes</div><div class="chats" id="chatlist"></div><div class="profile"><button class="sidebtn" id="profile"><span class="userdot">J</span><span>Jolgue <small style="display:block;color:#999">Mega Harness</small></span><span style="margin-left:auto">⋯</span></button></div></aside><main class="main"><header class="topbar"><button class="icon" id="openSide" title="Abrir barra lateral">☰</button><button class="topmodel" id="modelMenu">Mega Harness <span class="chev">⌄</span></button><div class="topactions"><button class="share" id="shareBtn">↗ Partilhar</button></div></header><div class="messages" id="scroll"><div class="conversation" id="conversation"></div></div><div class="composer-wrap"><div class="composer"><textarea class="prompt" id="prompt" rows="1" placeholder="Pergunta qualquer coisa"></textarea><div class="composer-tools"><button class="toolbtn" id="attach" title="Anexar ficheiro">＋</button><button class="toolbtn" id="toolsMenu">⋯ Ferramentas</button><button class="toolbtn" id="agentToggle" aria-pressed="false">◈ Agent</button><span class="toolspacer"></span><span class="model-select" id="selectedLabel">Seleciona um modelo</span><button class="send" id="send" title="Enviar">↑</button></div></div><div class="hint">O Mega Harness pode cometer erros. Verifica informações importantes.</div></div><div class="popover" id="modelPopover"></div><input type="file" id="file" class="hidden"></main></div><div class="modalback" id="modalback"><div class="modal" id="modal"></div></div><div id="toast" class="toast"></div><script>
const $=s=>document.querySelector(s);let models=JSON.parse(localStorage.mh_models||'[]'),chats=JSON.parse(localStorage.mh_chats||'[]'),active=localStorage.mh_active||'',selected=JSON.parse(localStorage.mh_selected||'[]'),busy=false,attached='';
function persist(){localStorage.mh_models=JSON.stringify(models);localStorage.mh_chats=JSON.stringify(chats);localStorage.mh_active=active;localStorage.mh_selected=JSON.stringify(selected)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function say(s){let e=$('#toast');e.textContent=s;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2300)}
function current(){return chats.find(c=>c.id===active)}
function newChat(){let c={id:Date.now().toString(36),title:'Nova conversa',messages:[]};chats.unshift(c);active=c.id;persist();render()}
function render(){if(!current()){if(chats.length)active=chats[0].id;else newChat()}let c=current();$('#conversation').innerHTML='';if(!c.messages.length){$('#conversation').innerHTML='<div class="welcome"><h1>Como posso ajudar?</h1><div class="suggestions"><button class="suggest" data-prompt="Ajuda-me a escrever um plano de estudos para esta semana.">✎ &nbsp;Ajuda-me a planear<small>Organiza ideias e tarefas</small></button><button class="suggest" data-prompt="Explica-me este tema de forma simples, com exemplos.">◉ &nbsp;Explica-me um tema<small>Aprende passo a passo</small></button><button class="suggest" data-prompt="Revê este texto e sugere melhorias.">▤ &nbsp;Melhora um texto<small>Escrita e revisão</small></button><button class="suggest" data-prompt="Dá-me ideias para começar um projeto.">⌘ &nbsp;Ajuda com uma ideia<small>Explora possibilidades</small></button></div></div>'}else c.messages.forEach((m,i)=>{let el=document.createElement('div');el.className='msg '+(m.role==='user'?'user':'assistant');el.innerHTML=m.role==='user'?'<div class="bubble">'+esc(m.text)+'</div>':'<div class="assistant-mark">✳</div><div><div class="bubble">'+esc(m.text)+'</div><div class="msg-tools"><button data-copy="'+i+'">▢ Copiar</button><button data-retry="'+i+'">↻ Tentar novamente</button></div></div>';$('#conversation').append(el)});$('#chatlist').innerHTML=chats.map(x=>'<div class="chatitem '+(x.id===active?'current':'')+'" data-id="'+x.id+'"><span>'+esc(x.title)+'</span><button data-delete="'+x.id+'" title="Apagar">⋯</button></div>').join('');$('#selectedLabel').textContent=selected.length?selected.map(i=>models[i]?.name||models[i]?.model).filter(Boolean).join(' + '):'Seleciona um modelo';$('#scroll').scrollTop=$('#scroll').scrollHeight}
function showModal(){let rows=models.map((m,i)=>'<div class="list-model"><div><b>'+esc(m.name||m.model)+'</b><small>'+esc(m.model)+' · '+esc(m.base)+'</small></div><button data-edit="'+i+'">Editar</button><button data-remove="'+i+'">Remover</button></div>').join('');$('#modal').innerHTML='<h2>Modelos e endpoints</h2><p>Adiciona APIs compatíveis com OpenAI. As chaves ficam guardadas só neste browser.</p><div id="modelRows">'+rows+'</div><button class="secondary" id="addModel">＋ Adicionar modelo</button><div class="modal-actions"><button class="secondary" id="exportCfg">Exportar</button><div class="right-actions"><button class="secondary" id="closeModal">Fechar</button><button class="primary" id="doneModal">Concluído</button></div></div>';$('#modalback').classList.add('open')}
function editModel(i){let m=i===undefined?{}:models[i],name=prompt('Nome para identificar o modelo:',m.name||'Meu modelo');if(name===null)return;let base=prompt('URL base OpenAI compatível (ex.: https://api.openai.com/v1):',m.base||'');if(base===null)return;let model=prompt('ID do modelo:',m.model||'');if(model===null)return;let key=prompt('Chave API (guardada neste browser):',m.key||'');if(key===null)return;let entry={name,base:base.replace(/\/$/,''),model,key};if(i===undefined)models.push(entry);else models[i]=entry;persist();showModal();render()}

{name:'move_file',description:'Move ou renomeia um ficheiro dentro de projetos.',parameters:{type:'object',properties:{from:{type:'string'},to:{type:'string'}},required:['from','to']}},
{name:'delete_file',description:'Apaga um ficheiro em projetos. A aplicação pede confirmação.',parameters:{type:'object',properties:{path:{type:'string'}},required:['path']}}
].map(t=>({type:'function',function:{name:t.name,description:t.description,parameters:t.parameters}}));
function normalizeProjectPath(path){let x=String(path||'').replace(/\\/g,'/').trim().replace(/^\/+|\/+$/g,'');if(x==='projetos')return 'projetos';if(x.startsWith('projetos/'))x=x.slice(9);let parts=x.split('/').filter(Boolean);if(parts.some(p=>p==='..'||p==='.'||p.includes('\\')))throw Error('Caminho inválido; só é permitido trabalhar dentro de projetos/.');if(!parts.length)throw Error('Indica um caminho dentro de projetos/.');return 'projetos/'+parts.join('/')}
function virtualSave(){localStorage.mh_project_files=JSON.stringify(projectFiles);localStorage.mh_project_folders=JSON.stringify(projectFolders)}
async function getRealFile(path,create){let rel=path.slice(9).split('/'),dir=projectDir;for(let i=0;i<rel.length-1;i++)dir=await dir.getDirectoryHandle(rel[i],{create:!!create});return dir.getFileHandle(rel[rel.length-1],{create:!!create})}
async function realWrite(path,content){let h=await getRealFile(path,true),w=await h.createWritable();await w.write(content);await w.close()}
async function fileList(root){let out=[];async function walk(dir,prefix){for await(let [name,h] of dir.entries()){let p=prefix?prefix+'/'+name:name;if(h.kind==='directory')await walk(h,p);else out.push('projetos/'+p)}}await walk(root,'');return out}
async function workspaceTool(name,args){if(name==='list_files'){let base;try{base=args.path?normalizeProjectPath(args.path):'projetos'}catch(e){return {error:e.message}}let files=projectDir?await fileList(projectDir):Object.keys(projectFiles);let prefix=base==='projetos'?'projetos/':base+'/';return {files:files.filter(x=>x.startsWith(prefix))}}
if(name==='read_file'){let p=normalizeProjectPath(args.path);if(projectDir){let h=await getRealFile(p,false);return {path:p,content:await(await h.getFile()).text()}}if(!(p in projectFiles))return {error:'Ficheiro não encontrado: '+p};return {path:p,content:projectFiles[p]}}
if(name==='search_files'){let q=String(args.query||'').toLowerCase(),files=projectDir?await fileList(projectDir):Object.keys(projectFiles),hits=[];for(let p of files){try{let d=await workspaceTool('read_file',{path:p});let lines=d.content.split('\n');lines.forEach((line,i)=>{if(line.toLowerCase().includes(q))hits.push({path:p,line:i+1,text:line.slice(0,300)})})}catch{}}return {matches:hits.slice(0,100)}}
if(name==='create_file'||name==='write_file'){let p=normalizeProjectPath(args.path),content=String(args.content||'');if(content.length>500000)return {error:'Limite de 500 KB por ficheiro.'};if(name==='create_file'&&projectDir){try{await getRealFile(p,false);return {error:'O ficheiro já existe.'}}catch{}}if(name==='create_file'&&!projectDir&&p in projectFiles)return {error:'O ficheiro já existe.'};if(projectDir)await realWrite(p,content);else projectFiles[p]=content;virtualSave();return {ok:true,path:p,bytes:content.length}}
if(name==='edit_file'){let p=normalizeProjectPath(args.path),r=await workspaceTool('read_file',{path:p});if(r.error)return r;let at=r.content.indexOf(args.old_text);if(at<0)return {error:'Texto a substituir não encontrado.'};let updated=r.content.slice(0,at)+args.new_text+r.content.slice(at+args.old_text.length);if(projectDir)await realWrite(p,updated);else projectFiles[p]=updated;virtualSave();return {ok:true,path:p}}
if(name==='create_folder'){let p=normalizeProjectPath(args.path);if(projectDir){let dir=projectDir;for(let part of p.slice(9).split('/'))dir=await dir.getDirectoryHandle(part,{create:true})}else if(!projectFolders.includes(p))projectFolders.push(p);virtualSave();return {ok:true,path:p}}
if(name==='delete_file'){let p=normalizeProjectPath(args.path);if(!confirm('O agente quer apagar '+p+'. Confirmas?'))return {cancelled:true};if(projectDir){let h=await getRealFile(p,false);let parts=p.slice(9).split('/'),parent=projectDir;for(let part of parts.slice(0,-1))parent=await parent.getDirectoryHandle(part);await parent.removeEntry(parts.at(-1))}else if(!(p in projectFiles))return {error:'Ficheiro não encontrado.'};else delete projectFiles[p];virtualSave();return {ok:true,deleted:p}}
if(name==='move_file'){let from=normalizeProjectPath(args.from),to=normalizeProjectPath(args.to),r=await workspaceTool('read_file',{path:from});if(r.error)return r;if(projectDir){await realWrite(to,r.content);let parts=from.slice(9).split('/'),parent=projectDir;for(let part of parts.slice(0,-1))parent=await parent.getDirectoryHandle(part);await parent.removeEntry(parts.at(-1))}else{projectFiles[to]=r.content;delete projectFiles[from]}virtualSave();return {ok:true,from,to}}
return {error:'Ferramenta desconhecida: '+name}}
async function agentRequest(model,messages){let payload={model:model.model,messages,temperature:+(localStorage.mh_temp||.7),max_tokens:+(localStorage.mh_tokens||2048),tools:agentTools,tool_choice:'auto'};let response=await fetch(model.base+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',...(model.key?{Authorization:'Bearer '+model.key}:{})},body:JSON.stringify(payload)});let data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error?.message||'HTTP '+response.status+' — confirma que este endpoint aceita tool calling.');return data.choices?.[0]?.message||{}}
function extractMarkup(content){let m=String(content||'').match(/<tool_call>([\s\S]*?)<\/tool_call>/);if(!m)return null;try{let x=JSON.parse(m[1]);return {tool_calls:[{id:'qwen-'+Date.now(),type:'function',function:{name:x.name,arguments:JSON.stringify(x.arguments||{})}}],clean:String(content).replace(m[0],'').trim()}}catch{return null}}
async function runAgent(model,conversation){let messages=[];let system=localStorage.mh_system||'';messages.push({role:'system',content:(system?system+'\n\n':'')+'Estás no modo Agent do Mega Harness. Podes usar as ferramentas para gerir ficheiros exclusivamente dentro da pasta projetos/. Antes de editar, lê os ficheiros relevantes. Usa create_file para novos ficheiros e write_file/edit_file para alterações. Nunca inventes resultados de ferramentas. Se não conseguires executar uma ferramenta, explica o motivo. Para apagar, pede confirmação através da ferramenta. As chamadas usam ferramentas OpenAI e também podes emitir <tool_call>{\"name\":\"read_file\",\"arguments\":{\"path\":\"projetos/ficheiro.txt\"}}</tool_call>.'});conversation.forEach(m=>messages.push({role:m.role,content:m.text}));let trace=[];for(let step=0;step<8;step++){let msg=await agentRequest(model,messages),parsed=extractMarkup(msg.content);if(parsed){msg.tool_calls=parsed.tool_calls;msg.content=parsed.clean||null}if(!msg.tool_calls?.length)return {text:msg.content||'O agente terminou sem uma resposta em texto.',trace};messages.push(msg);for(let call of msg.tool_calls){let name=call.function?.name,args={};try{args=typeof call.function.arguments==='string'?JSON.parse(call.function.arguments):call.function.arguments||{}}catch{args={}}let result;try{result=await workspaceTool(name,args)}catch(e){result={error:e.message}}trace.push({name,args,result});say(name.replaceAll('_',' ')+' · projetos');messages.push({role:'tool',tool_call_id:call.id||'call-'+step,content:JSON.stringify(result)})}}return {text:'Parei após 8 operações para não ficar num ciclo. Revê o estado dos ficheiros e pede a próxima alteração.',trace}}
async function workspaceScreen(){let files=projectDir?await fileList(projectDir):Object.keys(projectFiles);let rows=await Promise.all(files.map(async p=>{let x=projectDir?await workspaceTool('read_file',{path:p}):{content:projectFiles[p]||''};return '<div class="data-row"><div><b>'+esc(p)+'</b><small>'+String(x.content||'').length+' caracteres</small></div><button class="secondary" data-openfile="'+esc(p)+'">Abrir</button><button class="secondary" data-exportfile="'+esc(p)+'">Descarregar</button></div>'}));$('#modal').className='modal workspace-modal';$('#modal').innerHTML='<div class="workspace-head"><div><div class="workspace-kicker">ÁREA DE TRABALHO DO AGENTE</div><h2>'+icon('cloud')+' projetos/</h2><p>'+(projectDir?'Pasta real ligada nesta sessão.':'Espaço local do browser; os ficheiros ficam neste dispositivo.')+'</p></div><button class="round-btn" id="workspaceClose">×</button></div><div class="workspace-actions">'+(window.showDirectoryPicker?'<button class="secondary" id="connectFolder">'+icon('clip')+' Ligar pasta real</button>':'<span class="small-note">Acesso direto a pastas não suportado neste browser.</span>')+'<label class="secondary">'+icon('clip')+' Importar<input id="importProjectFile" type="file" multiple hidden></label><button class="secondary" id="exportWorkspace">'+icon('download')+' Exportar projeto</button><button class="primary" id="newProjectFile">'+icon('plus')+' Novo ficheiro</button></div><div class="workspace-files">'+(rows.join('')||'<div class="empty-state">'+icon('cloud')+'<b>A pasta projetos está vazia</b><span>Cria um ficheiro ou liga uma pasta local. O agente só poderá atuar nesta área.</span></div>')+'</div><div class="secure-note">'+icon('settings')+' No iPad/Safari, usa o espaço local do browser e exporta os ficheiros quando terminares.</div>';$('#modalback').classList.add('open')}
const previousShow=showModal;
showModal=function(tab){if(tab==='workspace'){workspaceScreen();return}previousShow(tab)};
$('#openworkspace').onclick=workspaceScreen;$('#modal').addEventListener('change',async e=>{if(e.target.id==='importProjectFile'){for(let f of e.target.files){let p=normalizeProjectPath(f.name),txt=await f.text();if(projectDir)await realWrite(p,txt);else projectFiles[p]=txt}virtualSave();workspaceScreen()}});
$('#modal').addEventListener('click',async e=>{if(e.target.closest('#exportWorkspace')){let paths=projectDir?await fileList(projectDir):Object.keys(projectFiles),bundle={folder:'projetos',files:{}};for(let p of paths){let r=await workspaceTool('read_file',{path:p});if(!r.error)bundle.files[p.slice(9)]=r.content}let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(bundle,null,2)],{type:'application/json'}));a.download='projetos-workspace.json';a.click();return}let exp=e.target.closest('[data-exportfile]');if(exp){let r=await workspaceTool('read_file',{path:exp.dataset.exportfile});if(!r.error){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r.content],{type:'text/plain;charset=utf-8'}));a.download=exp.dataset.exportfile.split('/').pop();a.click()}return}if(e.target.closest('#workspaceClose')){$('#modalback').classList.remove('open');return}if(e.target.closest('#connectFolder')){try{let h=await window.showDirectoryPicker({mode:'readwrite'});if(h.name.toLowerCase()!=='projetos'){say('Escolhe a pasta chamada projetos.');return}projectDir=h;say('Pasta projetos ligada nesta sessão.');workspaceScreen()}catch(x){if(x.name!=='AbortError')say('Não consegui ligar a pasta.')}return}if(e.target.closest('#newProjectFile')){let path=prompt('Caminho do ficheiro dentro de projetos/ (ex.: app.py):');if(!path)return;let content=prompt('Conteúdo inicial do ficheiro:','');if(content===null)return;let full=normalizeProjectPath(path);if(projectDir){await realWrite(full,content)}else projectFiles[full]=content;virtualSave();workspaceScreen();return}let f=e.target.closest('[data-openfile]');if(f){let r=await workspaceTool('read_file',{path:f.dataset.openfile});let content=prompt('Conteúdo de '+f.dataset.openfile+':',r.content);if(content!==null){if(projectDir)await realWrite(f.dataset.openfile,content);else projectFiles[f.dataset.openfile]=content;virtualSave();workspaceScreen()}return}});
$('#agentToggle').onclick=()=>{agentMode=!agentMode;$('#agentToggle').classList.toggle('agent-on',agentMode);$('#agentToggle').setAttribute('aria-pressed',String(agentMode));$('#agentToggle').innerHTML=icon('spark')+(agentMode?' Agent ligado':' Agent');$('#prompt').placeholder=agentMode?'Diz ao agente o que fazer nos teus projetos…':'Pergunta qualquer coisa';say(agentMode?'Modo Agent ligado.':'Modo Agent desligado.')};
send=async function(){if(busy)return;let text=$('#prompt').value.trim();if(!text&&!attachmentText)return;if(!selected.length){say('Configura primeiro um fornecedor compatível.');showModal('providers');return}let c=current(),body=text+(attachmentText?'\n\n[Conteúdo do ficheiro '+attachmentName+']\\n'+attachmentText:'');if(!c.messages.length)c.title=(text||attachmentName).slice(0,42);c.messages.push({role:'user',text:body});$('#prompt').value='';$('#prompt').style.height='auto';attachmentText='';attachmentName='';c.messages.push({role:'assistant',text:agentMode?'A iniciar o agente…':'A pensar…'});persist();render();busy=true;$('#send').disabled=true;let index=c.messages.length-1,model=models[selected[0]],start=performance.now();try{if(agentMode){let result=await runAgent(model,c.messages.slice(0,index));let log=result.trace.length?'\\n\\nOperações realizadas:\\n'+result.trace.map(x=>'• '+x.name.replaceAll('_',' ')+': '+(x.result.error||x.result.path||x.result.to||'concluído')).join('\n'):'';c.messages[index]={role:'assistant',text:result.text+log,ms:Math.round(performance.now()-start)}}else{let answers=await Promise.all(selected.map(async i=>{let m=models[i];try{return {name:m.name||m.model,text:await callModel(m,c.messages.slice(0,index))}}catch(e){return {name:m.name||m.model,error:e.message}}}));let good=answers.filter(x=>!x.error);c.messages[index]={role:'assistant',text:answers.length>1?answers.map(x=>'['+x.name+']\n'+(x.error?'ERRO: '+x.error:x.text)).join('\n\n──────────\n\n'):good[0]?.text||'Erro: '+answers[0].error,ms:Math.round(performance.now()-start)}}persist();render()}catch(e){c.messages[index]={role:'assistant',text:'Erro do Agent: '+e.message};render()}finally{busy=false;$('#send').disabled=false}};
const oldDrawPopover=drawPopover;
drawPopover=function(){oldDrawPopover();let p=$('#modelPopover');p.insertAdjacentHTML('afterbegin','<div class="agent-pop-note">'+(projectDir?'Pasta real ligada: projetos/':'Área local do agente: projetos/')+'</div>')};
